# goreleaser config — cross-compiled binaries, archives, checksums, GitHub Release.
# Docs: https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: snowball
    main: ./cmd/snowball
    binary: snowball
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: snowball
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto

brews:
  - name: snowball
    repository:
      owner: codcod
      name: homebrew-taps
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/codcod/snowball"
    description: "Render AsciiDoc books to PDF/EPUB via the native asciidoctor toolchain"
    dependencies:
      - name: ruby
      - name: node
    install: |
      bin.install "snowball"
    caveats: "Run `snowball setup` once to install the pinned gems, mermaid-cli, and Chrome."
