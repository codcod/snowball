# goreleaser config — cross-compiled binaries, archives, checksums, GitHub Release.
# Docs: https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: snowball
    main: ./cmd/snowball
    binary: snowball
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.Version={{ .Version }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: snowball
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto

# Homebrew tap publishing — enable once the tap repo is decided (PLAN.md open item 1).
# Requires HOMEBREW_TAP_TOKEN (PAT with write access to the tap repo) in the release
# workflow env. snowball is a native ORCHESTRATOR: it still needs ruby/node/chrome at
# runtime, so declare those as formula dependencies here (and document `snowball setup`
