name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@v4

      - name: lint
        run: just lint

      - name: build
        run: go build -ldflags "-X main.Version=ci" -o snowball ./cmd/snowball

      - name: test
        run: go test ./...

      - name: smoke
        run: ./snowball version && ./snowball --help
