# Attach the AsciiDoc user manual (built with snowball) to a GitHub release.
# GitHub-only: this workflow relies on `gh` and the `release` event, both specific
# to GitHub — there is no equivalent step here for other forges.
#
# Two triggers, because GitHub does not chain a `release: published` event when the release
# was created using the repo's default `secrets.GITHUB_TOKEN` — which is exactly what
# release.yml's goreleaser step does, so `release: published` alone never actually fires here
# (confirmed cross-repo: never fired for any of snowball's own 8 releases, nor for morty's
# first one). Only events raised by a real user or a PAT trigger further workflow runs.
# `release: published` is kept for a human-published release (e.g. one hand-edited via the
# UI); `workflow_run` covers the goreleaser-created case by reacting to `release.yml`
# finishing instead of to the release event it raises.
#
# Triggers whenever a release is published or a release run completes, regardless of what
# created it — the manual is not the release, so a broken manual build never blocks or
# unpublishes the release itself.
name: docs-release

on:
  release:
    types: [published]
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: write

jobs:
  attach-manual:
    if: github.event_name == 'release' || github.event.workflow_run.conclusion == 'success'
    # macOS, not ubuntu-latest: this step's own "brew update first" comment always assumed a
    # preinstalled Homebrew, which is true only on GitHub's macOS runners. Confirmed live (on
    # morty): ubuntu-latest has no `brew` at all ("command not found"), so this job has never
    # actually completed before now, on any of the three siblings.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # workflow_run carries no `release` payload, so the tag has to be looked up. The
      # release.yml run that just finished is, barring a race with a concurrent one, the
      # newest release in the repo.
      - name: Determine the release tag
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # `brew update` first: a preinstalled runner image's Homebrew snapshot can
      # lag behind the tap's bottle metadata, which otherwise only fails on fresh
      # runners and not on an already-updated developer machine.
      - name: Install snowball
        run: |
          brew update --quiet
          brew install codcod/tap/snowball
          snowball setup

      # A broken or missing docs source must never block the release: this step
      # is allowed to fail without failing the workflow.
      - name: Build user manual
        continue-on-error: true
        run: snowball build -o dist/docs

      - name: Attach user manual to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          shopt -s nullglob
          existing=(dist/docs/*.pdf dist/docs/*.epub)
          if [ ${#existing[@]} -eq 0 ]; then
            echo "::warning::Release $TAG has no user manual attached — the build step failed" \
              "or produced nothing; see the 'Build user manual' step's log."
            exit 0
          fi
          gh release upload "$TAG" "${existing[@]}" --clobber
